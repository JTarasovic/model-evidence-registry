name: publish

# Scheduled, immutable, attested snapshot publish (ADR 0028 §4, design doc §4-5).
#
# Each run builds the artifact from LIVE public sources and publishes it as an immutable, dated
# GitHub Release (never reused, never overwritten). There is no separate `latest` release: GitHub
# immutable releases permanently reserve a tag name, so a rolling mutable `latest` is impossible —
# consumers resolve `latest` client-side to the newest snapshot-* release (the af importer's
# selectNewestSnapshot). Live-source failures degrade rather than fail: a failed/stale source is
# recorded in manifest.json (absence of a fresh response is NOT a deletion), so the release still
# ships with whatever succeeded.

on:
  schedule:
    # Nightly, 07:17 UTC (odd minute to avoid the top-of-hour scheduler stampede).
    - cron: "17 7 * * *"
  workflow_dispatch:

# Least privilege for keyless build-provenance attestation, Cosign signing, and release creation.
permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    # The Sigstore certificate identity is pinned to this workflow on main in the consumer docs.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install locked runtime environment
        run: uv sync --locked

      - name: Build artifact from live sources
        run: uv run --locked registry build --live --out dist/

      - name: Compute immutable dated tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="snapshot-$(date -u +%Y-%m-%d)"
          tag="$base"
          # Immutable: if a release already exists for today (manual re-dispatch), disambiguate by
          # run number rather than overwriting the existing dated release.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            tag="${base}.${{ github.run_number }}"
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "Publishing immutable release: $tag"

      - name: Attest build provenance for artifact files
        uses: actions/attest@v4
        with:
          subject-path: "dist/*"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign manifest with keyless Sigstore
        run: |
          cosign sign-blob --yes \
            --bundle dist/manifest.json.sigstore.json \
            dist/manifest.json

      - name: Create immutable dated release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Model-evidence snapshot ${{ steps.tag.outputs.tag }}" \
            --notes "Immutable model-evidence snapshot. Checksums in manifest.json (artifacts[name].sha256); build provenance attested (verify with \`gh attestation verify\`); manifest keylessly signed with Cosign (manifest.json.sigstore.json). Schema version is manifest.json.schema_version." \
            dist/*
